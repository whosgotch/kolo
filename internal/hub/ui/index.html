<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kolo</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/xterm.css">
<style>
  /* Every colour and face is the brand's, read from /assets/tokens.css.
     Nothing below invents one. Surfaces are barely lighter than the ground
     they sit on: a hairline border does the separating, not a fill, so
     the sidebar and the terminal frame read as one dark canvas, not two
     panels glued together. */
  :root {
    --bg: var(--kolo-bg);
    --raised: color-mix(in srgb, var(--kolo-chalk) 5%, var(--kolo-bg));
    --raised-hover: color-mix(in srgb, var(--kolo-chalk) 9%, var(--kolo-bg));
    --line: color-mix(in srgb, var(--kolo-slate) 16%, transparent);
    --text: var(--kolo-fg);
    --dim: var(--kolo-fg-muted);
    --faint: color-mix(in srgb, var(--kolo-fg-muted) 75%, transparent);
    --structure: var(--kolo-accent);
    --ui: var(--kolo-sans);
    --mono: var(--kolo-mono);
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--ui);
         -webkit-font-smoothing: antialiased; }
  a { color: var(--structure); }
  /* Every display rule below would otherwise outrank the browser's own rule for
     the hidden attribute, which is how the views are switched. */
  [hidden] { display: none !important; }

  button, input, select { font: inherit; color: inherit; background: none; border: none; }
  button { cursor: pointer; }
  svg { display: block; flex: none; }

  /* Icon-weight controls: no fill, no border, a hover tint. The one shape
     every clickable thing in this app shares, whether it carries a label
     or not. */
  .icon-btn { background: none; border: 1px solid transparent; border-radius: 6px;
              width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
              color: var(--dim); }
  .icon-btn:hover { background: var(--raised); color: var(--text); }
  .icon-btn.off { opacity: 0.35; cursor: default; }
  .icon-btn.off:hover { background: none; }

  .go { display: inline-flex; align-items: center; gap: 7px; border-radius: 6px;
        padding: 5px 6px; color: var(--text); font: 500 13px var(--ui); }
  .go svg { color: var(--faint); }
  .go:hover { background: color-mix(in srgb, var(--kolo-chalk) 8%, transparent); }
  .go:active { transform: translateY(1px); }

  /* The mark, wherever it is drawn as text. */
  .ascii-mark { font-family: var(--mono); font-weight: 700; line-height: var(--kolo-mono-line);
                white-space: pre; color: var(--text); user-select: none; }
  .ascii-mark .hot { color: var(--kolo-state-running); }
  .wordmark { font: 500 15px var(--mono); letter-spacing: var(--kolo-wordmark-tracking);
              text-transform: lowercase; }

  /* ---- the door ----------------------------------------------------------- */

  .signin { height: 100%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 0 20px; gap: 4px; }
  .signin .ascii-mark { font-size: 13px; margin-bottom: 18px; }
  .signin h1 { margin: 0 0 10px; }
  .signin p { color: var(--dim); line-height: 1.7; max-width: 34em; margin: 0 0 22px; }
  .signin form { display: flex; gap: 8px; }
  .signin input { width: 26ch; font-family: var(--mono); background: var(--raised);
                  border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
  .signin input::placeholder { color: var(--faint); }
  .signin input:focus { outline: none; border-color: color-mix(in srgb, var(--structure) 55%, var(--line)); }
  .signin .problem { color: var(--kolo-state-failed); margin-top: 14px; }

  /* ---- the frame: agents down the side, one agent filling the rest -------- */

  .app { display: grid; grid-template-columns: 252px 1fr; height: 100%; }

  .side { display: flex; flex-direction: column; min-height: 0; background: var(--bg);
          border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; padding: 16px 14px 10px; }
  .brand-home { width: 32px; height: 32px; margin: -3px 0 -3px -5px; }
  /* The mark is the one thing here that isn't a control: no tile behind it
     on hover, just the mark lifting to full strength. */
  .brand-home:hover { background: none; }
  .brand .mark { width: 26px; height: 26px; color: var(--text); fill: var(--text);
                 opacity: 0.85; transition: opacity 120ms ease; }
  .brand-home:hover .mark { opacity: 1; }
  .dialog-head .mark { width: 14px; height: 14px; color: var(--text); fill: var(--text); }
  .brand .spacer { flex: 1; }

  .groups { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 8px 8px; display: flex;
            flex-direction: column; gap: 2px; }
  .group { display: flex; flex-direction: column; }
  .group-head { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
                background: none; border: none; border-radius: 6px; padding: 6px 6px 6px 4px;
                color: var(--dim); cursor: pointer; }
  .group-head:hover { background: var(--raised); color: var(--text); }
  .group-head .chevron { flex: none; color: var(--faint); transition: transform 0.12s ease; }
  .group-head .chevron.open { transform: rotate(90deg); }
  .group-head .chip { flex: none; width: 17px; height: 17px; border-radius: 5px; background: var(--raised);
                       border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
                       color: var(--dim); }
  .group-head .label { font: 600 11px var(--ui); text-transform: uppercase; letter-spacing: 0.6px;
                        color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-head:hover .label { color: var(--text); }
  .group-head .spacer { flex: 1; min-width: 4px; }
  .group-head .icon-btn { opacity: 0; }
  .group-head:hover .icon-btn { opacity: 1; }
  .group-body { display: flex; flex-direction: column; gap: 1px; padding-left: 10px; }
  .group-body.collapsed { display: none; }

  .no-hosts { padding: 18px 14px; text-align: center; }
  .no-hosts p { margin: 0 0 10px; color: var(--dim); font-size: 12px; line-height: 1.6; }
  .no-hosts p.fine { margin: 10px 0 0; color: var(--faint); font-size: 11px; }
  .no-hosts code { display: inline-block; background: var(--raised); border: 1px solid var(--line);
                    border-radius: 6px; padding: 4px 9px; color: var(--text); font: 12px var(--mono); }

  /* One agent in the side. The whole row is the button: a list of things to open
     where only part of each row opens it is a list that feels broken. */
  .agent { position: relative; display: flex; flex-direction: column; gap: 3px; width: 100%;
           text-align: left; background: none; border: none; border-radius: var(--r);
           padding: 7px 10px; color: var(--text); cursor: pointer; }
  .agent:hover { background: var(--raised); }
  .agent.on { background: var(--raised-hover); }
  /* A tint alone reads as "hovered" as easily as "open", so the accent bar is
     the one cue that means only one thing: this is the agent the main
     panel is showing right now. */
  .agent.on::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
                       width: 3px; border-radius: 2px; background: var(--structure); }
  .agent:focus-visible { outline: 1px solid color-mix(in srgb, var(--structure) 65%, var(--line)); outline-offset: -1px; }
  .agent .row { display: flex; align-items: center; gap: 7px; }
  .agent .name { font: 500 12.5px var(--mono); flex: 1; min-width: 0; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
  .agent.on .name { color: var(--kolo-chalk); font-weight: 600; }
  /* Sits where the name sits, reads as the name still being there rather
     than a form appearing on top of the row. */
  .agent .rename { flex: 1; min-width: 0; font: 500 12.5px var(--mono); color: var(--kolo-chalk);
                    background: var(--bg); border: 1px solid var(--structure); border-radius: 4px;
                    padding: 1px 5px; margin: -1px 0; }
  .agent .rename:focus { outline: none; }
  /* What's actually running, not just what it's named. A mark, not the
     word, an original glyph, not a logo kolo has no right to redraw. */
  .kind-chip { flex: none; width: 17px; height: 17px; border-radius: 999px; background: var(--raised);
               border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
               color: var(--dim); }
  .agent .dir { display: block; padding-left: 14px; color: var(--faint); font: 11px var(--mono);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; background: var(--kolo-state-idle); }
  .dot.failed { background: var(--kolo-state-failed); }
  .spinner { flex: none; }
  .spinner .track { stroke: color-mix(in srgb, var(--kolo-state-running) 20%, transparent); }
  .spinner .arc { stroke: var(--kolo-state-running); stroke-dasharray: 9 22.4; transform-origin: 6.5px 6.5px;
                   animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner .arc { animation: none; stroke-dasharray: 22.4 9; }
  }

  .drop { flex: none; width: 18px; height: 18px; border-radius: 5px; display: flex;
          align-items: center; justify-content: center; background: none; border: none;
          color: var(--faint); opacity: 0; }
  .agent:hover .drop { opacity: 1; }
  .drop:hover { background: color-mix(in srgb, var(--kolo-state-failed) 18%, transparent); color: var(--kolo-chalk); }

  .me-wrap { position: relative; border-top: 1px solid var(--line); }
  .me { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px;
        background: none; border: none; text-align: left; color: var(--text); cursor: pointer; }
  .me:hover { background: var(--raised); }
  .me:focus-visible { outline: 1px solid color-mix(in srgb, var(--structure) 65%, var(--line)); outline-offset: -1px; }
  .me .avatar { position: relative; flex: none; width: 26px; height: 26px; border-radius: 999px;
                background: color-mix(in srgb, var(--structure) 35%, var(--raised));
                border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .me .initial { font: 600 11px var(--mono); color: var(--kolo-chalk); }
  .me .presence { position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px;
                   border-radius: 999px; background: var(--structure); border: 2px solid var(--bg); }
  .me .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .me .name { font: 500 12.5px var(--ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me .status { font: 11px var(--ui); color: var(--faint); }
  .me .care { flex: none; color: var(--faint); }
  .me-menu { position: absolute; left: 10px; right: 10px; bottom: calc(100% + 6px);
             background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
             padding: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
  .me-item { display: block; width: 100%; text-align: left; border-radius: 6px;
             padding: 7px 9px; color: var(--text); font-size: 12.5px; }
  .me-item:hover { background: var(--raised-hover); }

  main { min-width: 0; display: flex; flex-direction: column; }

  /* ---- nothing open ------------------------------------------------------- */

  .home { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 6px; }
  /* Held back to near-background weight: the mark is what the empty screen
     is made of, not something it is asking you to read. */
  .mark-big .ascii-mark { font-size: 13px; margin-bottom: 0; opacity: 0.4; }
  /* With no agent anywhere, the mark takes the room it is otherwise politely
     sharing, and sits back further for having taken it. */
  .home.empty .mark-big .ascii-mark { font-size: clamp(13px, 2.2vw, 26px); opacity: 0.28; }

  /* ---- the dialog ----------------------------------------------------------- */

  .scrim { position: fixed; inset: 0; background: color-mix(in srgb, black 55%, transparent);
           display: flex; align-items: center; justify-content: center; z-index: 40; padding: 24px; }
  .dialog { width: 440px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column;
            background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
            box-shadow: 0 20px 60px color-mix(in srgb, black 50%, transparent); overflow: hidden; }
  .dialog-head { display: flex; align-items: center; gap: 10px; padding: 15px 12px 15px 20px;
                 border-bottom: 1px solid var(--line); }
  .dialog-head .mark { flex: none; width: 14px; height: 14px; color: var(--text); }
  .dialog-head h2 { flex: 1; margin: 0; font: 600 15px var(--ui); }
  .dialog-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px;
                 border-top: 1px solid var(--line); background: var(--raised); }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-row.single { grid-template-columns: 1fr; }
  .field label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; }
  .dialog input, .dialog select { background: var(--raised); color: var(--text); border: 1px solid var(--line);
              border-radius: 7px; padding: 9px 11px; font: 13px var(--mono); width: 100%; }
  .dialog input:focus, .dialog select:focus { outline: none;
              border-color: color-mix(in srgb, var(--structure) 55%, var(--line)); }

  /* A native select can't show a mark next to a name, so the agent field is
     drawn by hand: a short, known set, seen all at once. Falls back to a
     plain text field with suggestions only when the host lends anything
     (no fixed set exists to draw). */
  .kind-picker { display: flex; flex-direction: column; gap: 2px; background: var(--raised);
                  border: 1px solid var(--line); border-radius: 7px; padding: 4px; max-height: 200px;
                  overflow-y: auto; }
  .kind-choice { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 5px;
                  color: var(--dim); font: 12.5px var(--mono); text-align: left; }
  .kind-choice .kind-chip { background: var(--bg); }
  .kind-choice:hover { background: var(--raised-hover); color: var(--text); }
  .kind-choice.on { background: color-mix(in srgb, var(--structure) 16%, var(--raised)); color: var(--kolo-chalk); }
  .kind-choice.on .kind-chip { background: color-mix(in srgb, var(--structure) 30%, var(--raised));
                                 border-color: var(--structure); color: var(--kolo-chalk); }

  /* ---- one agent ---------------------------------------------------------- */

  .watch { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .screen { position: relative; flex: 1; min-height: 0; margin: 16px; padding: 14px 18px;
            border: 1px solid var(--line); border-radius: 10px; background: var(--kolo-void);
            display: flex; overflow: hidden; }
  /* The terminal is sized to the grid the hub settled on, and centred in
     whatever the frame has left over. */
  #term { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  /* Who's typing is a fact about the keyboard, read at the screen it's
     driving. */
  .typist { position: absolute; right: 14px; bottom: 12px; background: var(--raised);
            border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
            color: var(--dim); font: 11.5px var(--ui); white-space: nowrap; z-index: 1; }

  /* One line, always: a note appearing and going must not resize the screen
     above it, which would cost every watcher a repaint at a new size. */
  .note { height: 30px; margin: 0; padding: 7px 16px; color: var(--dim);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note.problem { color: var(--kolo-state-failed); }
</style>
</head>
<body>

<section class="signin" hidden>
  <div class="ascii-mark"></div>
  <h1 class="wordmark">kolo</h1>
  <p>Paste the token your org gave you. It is kept in a cookie this page cannot
     read, so you only do this once.</p>
  <form method="post" action="/login">
    <input name="token" type="password" placeholder="kolo_…" autofocus required>
    <button type="submit" class="go">
      sign in
      <svg width="13" height="13" viewBox="0 0 13 13"><path d="M2 6.5h9M7 2.5l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </form>
  <p class="problem" hidden>That token is not one this hub knows.</p>
</section>

<div class="app" hidden>
  <aside class="side">
    <div class="brand" title="kolo">
      <button class="icon-btn brand-home" title="home">
        <svg class="mark" width="26" height="26" viewBox="0 0 22 22" role="img" aria-label="Kolo">
          <path fill-rule="evenodd" fill="currentColor"
            d="M0.88,11 a10.12,10.12 0 1,0 20.24,0 a10.12,10.12 0 1,0 -20.24,0 Z
               M5.1194,9.6954 a7.1852,7.1852 0 1,0 14.3704,0 a7.1852,7.1852 0 1,0 -14.3704,0 Z"/>
        </svg>
      </button>
      <span class="spacer"></span>
      <button class="icon-btn new" title="new agent">
        <svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="groups"></div>
    <div class="me-wrap">
      <button class="me" type="button">
        <span class="avatar"><span class="initial"></span><span class="presence"></span></span>
        <span class="who"><span class="name"></span><span class="status">online</span></span>
        <svg class="care" width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">
          <path d="M2 6.5 5.5 3l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </button>
      <div class="me-menu" hidden>
        <form method="post" action="/logout"><button class="me-item" type="submit">sign out</button></form>
      </div>
    </div>
  </aside>

  <main>
    <!-- Nothing open: the mark alone. Starting an agent lives in the side,
         so this screen does not repeat the offer. -->
    <section class="home" hidden>
      <div class="mark-big"><div class="ascii-mark"></div></div>
    </section>

    <section class="watch" hidden>
      <div class="screen">
        <div id="term"></div>
        <span class="typist" hidden></span>
      </div>
      <p class="note"></p>
    </section>
  </main>
</div>

<!-- New agent, as a dialog: a deliberate, occasional act, reachable from
     either + regardless of what's open behind it, and closing back to
     exactly that. -->
<div class="scrim" hidden>
  <div class="dialog" role="dialog" aria-label="new agent">
    <div class="dialog-head">
      <svg class="mark" width="14" height="14" viewBox="0 0 18 18" role="img" aria-label="Kolo">
        <path fill-rule="evenodd" fill="currentColor"
          d="M0.72,9 a8.28,8.28 0 1,0 16.56,0 a8.28,8.28 0 1,0 -16.56,0 Z
             M4.1886,7.9326 a5.8788,5.8788 0 1,0 11.7576,0 a5.8788,5.8788 0 1,0 -11.7576,0 Z"/>
      </svg>
      <h2>New agent</h2>
      <button type="button" class="icon-btn close" title="close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form class="create">
      <div class="dialog-body">
        <div class="field agent-field">
          <label>agent</label>
          <div class="kind-picker" hidden></div>
          <input name="command" list="known-commands" placeholder="any command, like claude --model opus" hidden disabled>
          <datalist id="known-commands"></datalist>
        </div>
        <div class="field-row">
          <div class="field host-field">
            <label for="new-host">host</label>
            <select id="new-host" name="host"></select>
          </div>
          <div class="field">
            <label for="new-dir">directory</label>
            <select id="new-dir" name="dir"></select>
            <input name="dir" placeholder="anywhere, like /home/me/proj" hidden disabled>
          </div>
        </div>
        <div class="field">
          <label for="new-name">name</label>
          <input id="new-name" name="name" placeholder="name" maxlength="32" required>
        </div>
      </div>
      <p class="note dialog-note"></p>
      <div class="dialog-foot">
        <button type="submit" class="go">
          <svg width="13" height="13" viewBox="0 0 14 14"><path d="M2.5 7.5 5.5 10.5 11.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          create
        </button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/xterm.js"></script>
<script src="/assets/addon-canvas.js"></script>
<script>
// One page, two views: the door, and the org's agents. Which agent is open
// comes from the URL, so opening one and reloading lands back on it.
const el = (sel) => document.querySelector(sel);
const views = { signin: el('.signin'), app: el('.app') };

function show(name) {
  for (const [key, node] of Object.entries(views)) node.hidden = key !== name;
}

function agentInURL() {
  const m = location.hash.match(/^#\/agent\/([a-z0-9-]+)$/);
  return m && m[1];
}

// The mark, generated by the same ring geometry the brand tooling uses
// (brand/ring.ts), drawn once into every place it appears, not
// redrawn by hand each time.
const HOT = new Set(['%', '@']);
const ASCII_ROWS = [
  '                .:.                ',
  '         .:==*********==:.         ',
  '       :*#####+-::. .::-=+=:       ',
  '     -#####*-             :=+:     ',
  '   .+%%%##-                 :+=.   ',
  '  .#%%%%%-                   :++.  ',
  '  +%%%%%=                     -*=  ',
  ' .%%%%%%-                     .**. ',
  ' -@@@@@@-                     .**: ',
  ' -@@@@@@#                     -**: ',
  ' .@@@@@@@-                   :***. ',
  '  *@@@@@@@+                 =###=  ',
  '  .%@@@@@@@%+.           .-*###*.  ',
  '   .*@@@@@@@@@%*=------+*%####+.   ',
  '     =%@@@@@@@@@@@@%%%%%%%%%#-     ',
  '       -#@@@@@@@@@@%%%%%%%*-       ',
  '         .-**@@@@@@%%%++-.         ',
  '                .-.                ',
];
function drawMark(node) {
  node.textContent = '';
  for (const line of ASCII_ROWS) {
    const row = document.createElement('div');
    for (const ch of line) {
      if (HOT.has(ch) && row.lastChild && row.lastChild.className === 'hot') {
        row.lastChild.textContent += ch;
      } else if (HOT.has(ch)) {

        span.className = 'hot';

      } else {

      }

// Returns {viewBox, inner}: a known mark at its own native viewBox, or one
// of the abstract fallbacks at the shared 12x12 grid they were drawn on.
function kindGlyph(command) {
  const p = programOf(command).toLowerCase();
  if (KNOWN_MARKS[p]) return KNOWN_MARKS[p];
  if (!p) return { viewBox: '0 0 12 12', inner: KIND_GLYPHS[0] };

  h ^= h >>> 16;

let hosts = [];
let signedIn = false;
let me = {};
// The agents from the last successful refresh, kept so a rename can redraw
// the side without waiting on a round trip that has nothing to do with it.
let lastAgents = [];

async function refresh() {
  const resp = await fetch('/v1/agents');
  signedIn = resp.status !== 401;
  if (!signedIn) {
    show('signin');
    el('.signin .problem').hidden = !location.search.includes('refused');
    return null;
  }
  const data = await resp.json();
  show('app');
  el('.me .name').textContent = data.you.name;
  el('.me .initial').textContent = (data.you.name.trim().slice(0, 1) || '?').toUpperCase();
  me = data.you;
  hosts = data.hosts;
  lastAgents = data.agents || [];
  drawGroups(lastAgents);
  // Nothing running anywhere: the home screen is the mark, not a mark with
  // a list beside it.
  el('.home').classList.toggle('empty', lastAgents.length === 0);
  drawChoices();
  return data;
}

// Which agent's name is being edited, and what it currently reads, kept at
// module level, not per-row state, since drawGroups rebuilds the whole side
// from scratch on every refresh and has to know to draw an input instead of
// a name for exactly one row.
let renamingId = null;
let renameDraft = '';

function startRename(a) {
  renamingId = a.name;
  renameDraft = a.label || a.name;
  drawGroups(lastAgents);
}

function cancelRename() {
  renamingId = null;
  drawGroups(lastAgents);
}

async function commitRename() {
  const id = renamingId;
  const draft = renameDraft.trim();
  const current = lastAgents.find((a) => a.name === id);
  // Nothing worth a round trip: empty is a mis-click, unchanged is a blur
  // that wasn't really an edit.
  if (!id || !draft || (current && draft === (current.label || current.name))) {
    cancelRename();
    return;
  }
  renamingId = null;
  const resp = await fetch(`/v1/agents/${id}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label: draft }),
  });
  if (!resp.ok) alert((await resp.text()).trim());
  refresh();
}

// drawGroups redraws the side: one collapsible group per host lending
// itself, its agents nested under it, rather than the host repeated as
// text on every row.
const collapsed = {};
function drawGroups(agents) {
  const open = agentInURL();
  const container = el('.groups');
  container.replaceChildren();

  const byHost = new Map();
  for (const a of agents) {
    if (!byHost.has(a.host)) byHost.set(a.host, []);
    byHost.get(a.host).push(a);
  }
  // Every lending host gets a section, whether or not it has an agent on it
  // yet: a host that just connected and is waiting for its first agent is
  // a normal, common state, not one to hide. Order is the host list's own
  // order, stable across a refresh rather than jumping around with whatever
  // order agents happen to load in; an agent whose host has since dropped
  // still gets a group, so it is never silently lost from view.
  const order = hosts.map((h) => h.id);
  for (const id of byHost.keys()) if (!order.includes(id)) order.push(id);

  if (order.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'no-hosts';
    empty.innerHTML = `<p>No machine is lending itself to this org yet.</p>
      <code>kolo host</code>
      <p class="fine">Run it on a machine to connect it here.</p>`;
    container.append(empty);
    return;
  }

  for (const host of order) {
    const members = byHost.get(host) || [];
    const group = document.createElement('div');
    group.className = 'group';

    const head = document.createElement('button');
    head.className = 'group-head';
    head.type = 'button';
    head.innerHTML = `
      <svg class="chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 1.5l4 3.5-4 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span class="chip"><svg width="10" height="10" viewBox="0 0 14 14"><rect x="1" y="1.5" width="12" height="8" rx="1.3" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M5 12.5h4M7 9.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
      <span class="label"></span>
      <span class="spacer"></span>
      <button type="button" class="icon-btn add" title="new agent on ${host}">
        <svg width="12" height="12" viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>`;
    head.querySelector('.label').textContent = host;
    const isCollapsed = !!collapsed[host];
    head.querySelector('.chevron').classList.toggle('open', !isCollapsed);
    head.onclick = () => {
      collapsed[host] = !collapsed[host];
      drawGroups(agents);
    };
    head.querySelector('.add').onclick = (ev) => {
      ev.stopPropagation();
      openCreate(host);
    };

    const body = document.createElement('div');
    body.className = 'group-body' + (isCollapsed ? ' collapsed' : '');

    for (const a of members) {
      // A div, not a button: a real <button> can't legally contain the
      // .drop stop button nested inside it, so this carries the button role
      // and keyboard activation by hand instead.
      const row = document.createElement('div');
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.className = 'agent' + (a.name === open ? ' on' : '');
      row.innerHTML = `
        <span class="row"></span>
        <span class="dir"></span>`;
      const rowInner = row.querySelector('.row');
      // The registry only knows starting/running/failed. Busy-vs-idle is a
      // fact about the live screen, which only exists for whichever agent
      // is actually being watched right now.
      const busy = a.name === open && doing === 'busy';
      if (busy) {
        const spinner = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        spinner.setAttribute('class', 'spinner');
        spinner.setAttribute('width', '13'); spinner.setAttribute('height', '13'); spinner.setAttribute('viewBox', '0 0 13 13');
        spinner.innerHTML = `<circle class="track" cx="6.5" cy="6.5" r="5" fill="none" stroke-width="1.6"/>
          <circle class="arc" cx="6.5" cy="6.5" r="5" fill="none" stroke-width="1.6" stroke-linecap="round"/>`;
        rowInner.append(spinner);
      } else {
        const dot = document.createElement('span');
        dot.className = 'dot' + (a.status === 'failed' ? ' failed' : '');
        rowInner.append(dot);
      }
      if (a.name === renamingId) {
        const input = document.createElement('input');
        input.className = 'rename';
        input.value = renameDraft;
        input.oninput = (ev) => { renameDraft = ev.target.value; };
        input.onkeydown = (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); commitRename(); }
          else if (ev.key === 'Escape') { ev.preventDefault(); cancelRename(); }

      chip.className = 'kind-chip';

      const mark = kindGlyph(a.command);
      chip.innerHTML = `<svg width="10" height="10" viewBox="${mark.viewBox}">${mark.inner}</svg>`;
      rowInner.append(chip);

      drop.type = 'button';
      drop.className = 'drop';

      drop.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

      };
      body.append(row);
    }

    group.append(head, body);
    container.append(group);
  }
}

// drawChoices fills the create dialog with what the hosts are lending. The
// choices are the host's own terms, so nothing can be picked that will only
// be refused a moment later, unless the host lent any command or any
// directory, in which case that field opens up into free text.
function drawChoices() {
  const hostSel = el('#new-host'), dirSel = el('#new-dir'), dirInput = el('input[name=dir]');
  const picker = el('.kind-picker'), cmdInput = el('input[name=command]'), known = el('#known-commands');
  const hostField = el('.host-field');
  const chosen = hostSel.value || createHostPref;
  fill(hostSel, hosts.map((h) => h.id));
  if (chosen && hosts.some((h) => h.id === chosen)) hostSel.value = chosen;
  // Asking which host is not a question when only one machine is lending
  // itself. The field disappears rather than making you answer something
  // that only ever has one answer.
  hostField.hidden = hosts.length <= 1;
  el('.field-row').classList.toggle('single', hosts.length <= 1);

  const host = hosts.find((h) => h.id === hostSel.value) || hosts[0];
  const lendingEverywhere = !!host && (host.dirs || []).includes('*');
  dirSel.hidden = dirSel.disabled = lendingEverywhere;
  dirInput.hidden = dirInput.disabled = !lendingEverywhere;
  if (!lendingEverywhere) fill(dirSel, host ? host.dirs : []);

  const lendingAny = !!host && (host.allow || []).includes('*');
  picker.hidden = lendingAny;
  cmdInput.hidden = cmdInput.disabled = !lendingAny;
  known.replaceChildren();
  if (lendingAny) {
    for (const name of new Set([...(host.allow || []).filter((c) => c !== '*'), ...(host.found || [])])) {
      const option = document.createElement('option');
      option.value = name;
      known.append(option);
    }
  } else {
    drawKindPicker(host ? host.allow : []);
  }
  el('form.create button[type=submit]').disabled = hosts.length === 0;
  say('.dialog-note', hosts.length === 0 ? 'No machine is lending itself to this org right now.' : '');
}

// drawKindPicker is the agent field for a host that lends a fixed set of
// commands: one row per command, a mark next to each rather than a plain
// list a select could already do.
let pickedCommand = null;
function drawKindPicker(commands) {
  const picker = el('.kind-picker');
  picker.replaceChildren();
  if (!commands.includes(pickedCommand)) pickedCommand = commands[0] || null;
  for (const command of commands) {
    const choice = document.createElement('button');
    choice.type = 'button';
    choice.className = 'kind-choice' + (command === pickedCommand ? ' on' : '');
    const mark = kindGlyph(command);
    choice.innerHTML = `<span class="kind-chip"><svg width="10" height="10" viewBox="${mark.viewBox}">${mark.inner}</svg></span><span></span>`;
    choice.querySelector('span:last-child').textContent = command;
    choice.onclick = () => { pickedCommand = command; drawKindPicker(commands); };
    picker.append(choice);
  }
}

// options may be absent rather than empty: a host that lends nothing sends null
// for it, and Go writes an empty slice as null besides. Reading it as [] keeps a
// missing list from throwing halfway through drawing the form, which is how the
// dir and command boxes came to be empty while the machine box was filled.
function fill(select, options) {
  const chosen = select.value;
  select.replaceChildren();
  for (const value of options || []) {
    const option = document.createElement('option');
    option.value = option.textContent = value;
    select.append(option);
  }
  if ((options || []).includes(chosen)) select.value = chosen;
}

el('#new-host').onchange = drawChoices;

// The dialog is reachable from either +, the heading's and each group's,
// regardless of what's open behind it, and closes back to exactly that.
let createHostPref = null;
function openCreate(hostPref) {
  createHostPref = hostPref || null;
  drawChoices();
  el('.scrim').hidden = false;
  el('#new-name').focus();
}
function closeCreate() {
  el('.scrim').hidden = true;
  el('form.create').reset();
  say('.dialog-note', '');
}
el('.side .new').onclick = () => openCreate(null);
el('.brand-home').onclick = () => { location.hash = ''; };
el('.dialog .close').onclick = closeCreate;
el('.scrim').onclick = (ev) => { if (ev.target === el('.scrim')) closeCreate(); };

el('form.create').onsubmit = async (ev) => {
  ev.preventDefault();
  const form = new FormData(ev.target);
  const lendingAny = !el('input[name=command]').hidden;
  const command = lendingAny ? form.get('command') : pickedCommand;
  const body = JSON.stringify({
    name: form.get('name'), host: form.get('host'),
    dir: form.get('dir'), command,
  });
  const resp = await fetch('/v1/agents', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
  });
  if (!resp.ok) {
    say('.dialog-note', (await resp.text()).trim(), true);
    return;
  }
  const made = await resp.json();
  closeCreate();
  await refresh();
  location.hash = `#/agent/${made.name}`;
};

async function stop(name) {
  if (!confirm(`Stop ${name}? Its conversation goes with it.`)) return;
  const resp = await fetch(`/v1/agents/${name}`, { method: 'DELETE' });
  if (!resp.ok) alert((await resp.text()).trim());
  if (agentInURL() === name) location.hash = '';
  refresh();
}

function say(sel, message, problem) {
  const note = el(sel);
  note.textContent = message;
  note.classList.toggle('problem', !!problem);
}

// The profile control: click opens the menu, click away or sign-out closes it.
el('.me').onclick = () => { el('.me-menu').hidden = !el('.me-menu').hidden; };
document.addEventListener('click', (ev) => {
  if (!el('.me-wrap').contains(ev.target)) el('.me-menu').hidden = true;
});

// The terminal is drawn at one size and never scaled to fill the window. The
// grid is the agent's, shared by everybody watching, and the hub already keeps
// it inside the smallest of their windows, so a window with room to spare shows
// the same screen with black around it rather than the same screen blown up.
const fontSize = 13;

const term = new Terminal({
  // Keystrokes go to the agent as they are pressed. See onData below. Whoever
  // types last is the typist the others see.
  disableStdin: false,
  cursorBlink: true,
  // What the agent says is what the machine says, so it is said in the
  // brand's mono. The stack behind it is what draws until the file arrives.
  fontFamily: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
  fontSize: fontSize,
  customGlyphs: true,
  scrollback: 5000,
  theme: { background: '#101314', foreground: '#E7E9E4',
           cursor: '#2C6F62', selectionBackground: '#2C6F62' },
});
term.open(el('#term'));

// The DOM renderer sets block glyphs in whatever font the browser picks, which
// leaves seams between quadrants. The canvas renderer draws them itself, the way
// a real terminal does. An enhancement, not a requirement.
try {
  term.loadAddon(new CanvasAddon.CanvasAddon());
} catch (e) {
  console.warn('canvas renderer unavailable, falling back to the DOM', e);
}

// What the open agent's screen is doing, which is the only place brass is
// earned: the hub says this about the screen being watched and no other.
let doing = null;

// Who typed at the agent being watched last.
let typist = null;

// Keystrokes go up as they are pressed. Nothing is interpreted here: what the
// agent does with an Escape or an arrow is the agent's business, and the browser
// terminal has already encoded it the way a real one would.
term.onData((keys) => {
  if (!socket) return;
  tell({ type: 'keys', keys });
});

let socket = null;
let watching = null;

// room is what the frame has left to draw a terminal in.
function room() {
  const box = el('#term').getBoundingClientRect();
  return { w: Math.floor(box.width), h: Math.floor(box.height) };
}

// cell is what one character measures, read back off the terminal rather than
// guessed at with a canvas: xterm decides its own line height and letter
// spacing, and a guess a pixel out puts a column over the edge.
//
// Measured once. It is the same for every character at a size that never
// changes, and measuring it again while a resize is still being drawn reads the
// old screen against the new grid, which is how a terminal ends up scaled to
// twice the window.
let measured = null;
function cell() {
  if (measured) return measured;
  const drawn = term.element && term.element.querySelector('.xterm-screen');
  if (!drawn || !drawn.offsetWidth || !term.cols || !term.rows) return null;
  measured = { w: drawn.offsetWidth / term.cols, h: drawn.offsetHeight / term.rows };
  return measured;
}

// propose tells the hub what this window can draw. Everyone watching sends this
// and the smallest wins, so nobody is shown a screen the agent has drawn wider
// than their window.
function propose() {
  const box = room(), c = cell();
  // A view that is not on screen measures zero, and the smallest proposal wins:
  // sizing the agent's terminal from a window nobody is looking at would shrink
  // it for everybody who is.
  if (!c || !box.w || !box.h) return;
  tell({
    type: 'size',
    cols: Math.max(20, Math.floor(box.w / c.w)),
    rows: Math.max(6, Math.floor(box.h / c.h)),
  });
}

addEventListener('resize', propose);

// A cell measured in the fallback face is the wrong width, and it is cached: the
// grid would be proposed from it for as long as the page is open. Measured again
// once the real face has arrived, and the hub told what changed.
if (document.fonts) {
  document.fonts.ready.then(() => { measured = null; propose(); });
}

function watch(name) {
  close();
  watching = name;
  connect(name);
}

function close() {
  watching = null;
  offer('unknown');
  typist = null; keyboardChanged();
  if (socket) { const was = socket; socket = null; was.close(); }
}

function connect(name) {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}/v1/watch/${name}`);
  ws.binaryType = 'arraybuffer';
  socket = ws;

  // Every handler checks it is still the current socket: a superseded one still
  // reports its own close, which would land after the replacement opened.
  ws.onopen = () => {
    if (ws !== socket) return;
    say('.watch .note', `watching ${name}`);
    // Before anything else: the agent should be drawing a screen this window can
    // show, and it cannot know the size until somebody tells it.
    propose();
  };

  ws.onmessage = (ev) => {
    if (ws !== socket) return;
    if (typeof ev.data !== 'string') {
      term.write(new Uint8Array(ev.data));
      return;
    }
    const msg = JSON.parse(ev.data);
    switch (msg.type) {
      case 'size':
        term.resize(msg.cols, msg.rows);
        break;
      case 'state':
        say('.watch .note', describe(msg.state));
        break;
      case 'interrupted':
        say('.watch .note', `${msg.from} stopped the agent`);
        break;
      // Who typed last. Announced on the screen everybody is watching, so it
      // arrives in step with what the agent does.
      case 'keyboard':
        typist = msg.who || null;
        keyboardChanged();
        break;
      // Both arrive just before the screen goes, so they are the last thing
      // anyone watching is told about the process they were watching.
      case 'restarted':
        say('.watch .note', `${msg.from} restarted the agent`);
        break;
      case 'fresh':
        say('.watch .note', `${msg.from} started the agent fresh. Its conversation is gone`);
        break;
      case 'refused':
        say('.watch .note', msg.text, true);
        break;
    }
    // What can be done comes from the same events as what the agent is doing, so
    // stop is never offered for a screen the agent has left behind.
    if (msg.state) offer(msg.state);
  };

  // Falling behind, an agent restarting, and one not started yet all end the
  // same way: reconnect, and the next repaint resyncs.
  ws.onclose = () => {
    if (ws !== socket) return;
    // Nothing may be offered about a screen this page is no longer being told
    // about: the agent may be restarting, or gone.
    offer('unknown');
    typist = null; keyboardChanged();
    say('.watch .note', `waiting for ${name} to show a screen`);
    setTimeout(() => { if (watching === name) connect(name); }, 1000);
  };
  ws.onerror = () => ws.close();
}

// The states come from the agent's own screen, so this says what is true rather
// than what kolo intended.
function describe(state) {
  switch (state) {
    case 'idle': return 'ready';
    case 'busy': return 'working';
    // Kolo says that a question is up, never what it is: reading the question is
    // what the screen in front of you is for, and answering it is what typing
    // is for.
    case 'dialog': return 'waiting on a person: type to answer it';
    default: return 'kolo does not recognise this screen, so nothing will be sent';
  }
}

// offer records what the watched screen is doing. Read back by drawGroups
// for the sidebar's busy spinner, the only thing left that depends on it,
// now that the web UI has no controls of its own that care.
function offer(state) {
  doing = state;
}

// keyboardChanged redraws who typed last.
function keyboardChanged() {
  const bar = el('.typist');
  bar.hidden = !typist;
  bar.textContent = typist ? (typist === me.name ? 'you are typing' : `${typist} is typing`) : '';
}

// tell sends one thing to the agent. Who it is from is the hub's word, taken
// from the connection, so there is nothing to send about that.
function tell(what) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    say('.watch .note', 'not connected', true);
    return false;
  }
  socket.send(JSON.stringify(what));
  return true;
}


// ---- routing -----------------------------------------------------------

async function route() {
  const name = agentInURL();
  // The screen is put up before the list is fetched, so opening an agent does
  // not wait on a round trip that has nothing to do with it.
  el('.watch').hidden = !name;
  el('.home').hidden = !!name;
  if (name) {
    if (watching !== name) watch(name);
  } else {
    close();
    term.reset();
  }
  await refresh();
}

addEventListener('hashchange', route);
route();
// The list is a live thing: agents appear when somebody else makes one, and
// change status on their own. Paused mid-rename: a redraw would tear out
// the input a member is still typing into.
setInterval(() => { if (signedIn && !renamingId) refresh(); }, 3000);
</script>
</body>
</html>
