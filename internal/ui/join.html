<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>join kolo</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/tokens.css">
<style>
  /* The brand's colours and faces, from /assets/tokens.css. Prose is sans, and
     what the machine says — the org's name, the token — is mono. */
  :root {
    --bg: var(--kolo-bg); --panel: var(--kolo-bg-raised);
    --line: color-mix(in srgb, var(--kolo-slate) 30%, transparent);
    --text: var(--kolo-fg); --dim: var(--kolo-fg-muted);
    --mono: var(--kolo-mono); --ui: var(--kolo-sans);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; font: 13px/1.5 var(--ui); align-items: center; justify-content: center; }
  [hidden] { display: none !important; }
  main { max-width: 34em; padding: 16px; }
  .mark { width: 44px; height: 44px; border-radius: 10px; margin-bottom: 12px; }
  h1 { font: 500 15px var(--mono); letter-spacing: var(--kolo-wordmark-tracking);
       text-transform: lowercase; margin: 0 0 12px; }
  p { color: var(--dim); line-height: 1.6; }
  .org { font-family: var(--mono); }
  button, input {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  input { font-family: var(--mono); }
  button { cursor: pointer; background: var(--kolo-accent);
           border-color: var(--kolo-accent); color: var(--kolo-chalk); }
  button:hover { filter: brightness(1.15); }
  .problem { color: var(--kolo-state-failed); }
</style>
</head>
<body data-org="{{.Org}}">
<main>
  <img class="mark" src="/assets/icon.png" alt="">
  <h1>join <span class="org"></span></h1>

  <section class="ask" hidden>
    <p>What should everyone call you? It is the name against everything you do
       to an agent, and everyone watching sees it.</p>
    <form method="post" action="/join">
      <input name="invite" type="hidden">
      <input name="name" placeholder="your name" maxlength="40" autofocus required>
      <button type="submit">join</button>
    </form>
  </section>

  <p class="problem nolink" hidden>This link is missing its invite. Ask for the whole
     of it — everything after the <code>#</code> is the part that matters.</p>
  <p class="problem refused" hidden>This invite no longer works. Ask whoever runs
     kolo for another.</p>
</main>

<script>
  // The invite rides in the fragment, which browsers do not send anywhere: it
  // stays out of the hub's logs, out of proxies in between, and out of the
  // Referer header of everything this page could go on to load.
  const invite = decodeURIComponent(location.hash.slice(1));
  const org = document.querySelector('.org');
  org.textContent = document.body.dataset.org || 'kolo';

  const show = sel => document.querySelector(sel).hidden = false;
  if (new URLSearchParams(location.search).has('refused')) {
    show('.refused');
  } else if (!invite.startsWith('kolo_')) {
    show('.nolink');
  } else {
    document.querySelector('input[name=invite]').value = invite;
    show('.ask');
  }
</script>
</body>
</html>
