<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kolo</title>
<link rel="stylesheet" href="/assets/xterm.css">
<style>
  :root {
    --bg: #0b0b0b; --panel: #141414; --line: #262626;
    --text: #ddd; --dim: #8a8f94; --warn: #e88; --ok: #7fb37f;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; font: 13px var(--mono); }
  /* Every display rule below would otherwise outrank the browser's own rule for
     the hidden attribute, which is how the views are switched. */
  [hidden] { display: none !important; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .org { font-weight: 600; }
  header .spacer { flex: 1; }
  header .who { color: var(--dim); }

  button, input, select {
    background: #1b1b1b; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 8px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: #232323; }
  button:disabled { opacity: .5; cursor: default; }
  button.quiet { background: none; border-color: transparent; color: var(--dim); }
  button.quiet:hover { color: var(--text); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pad { padding: 16px; overflow: auto; }

  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; color: var(--dim); font-weight: normal; padding: 6px 10px; }
  td { padding: 8px 10px; border-top: 1px solid var(--line); }
  tr.agent:hover td { background: #151515; }
  td.name button { background: none; border: none; padding: 0; color: var(--text); text-decoration: underline; }
  td.dir { color: var(--dim); }

  .status { display: inline-block; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
  .status.running { color: var(--ok); }
  .status.failed { color: var(--warn); }
  .status.starting { color: var(--dim); }

  form.create { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0 0; }
  form.create input[name=name] { width: 18ch; }

  /* The section has to be a column that fills main, or the terminal grows to
     its content and pushes the compose box off the bottom of the page. */
  .watch { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #term { flex: 1; min-height: 0; overflow: hidden; padding: 4px; }
  form.compose { display: flex; gap: 8px; padding: 0 12px 12px; }
  form.compose input { flex: 1; }
  /* The question the agent is asking, drawn as buttons rather than left for
     somebody to steer through blind. */
  .ask { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px 0; }
  .ask button { text-align: left; }
  .ask button.selected { border-color: var(--dim); }

  .note { min-height: 1.4em; padding: 6px 12px; color: var(--dim); }
  .note.problem { color: var(--warn); }
  .empty { color: var(--dim); padding: 24px 0; }

  .signin { max-width: 34em; margin: 12vh auto; padding: 0 16px; }
  .signin p { color: var(--dim); line-height: 1.6; }
  .signin form { display: flex; gap: 8px; }
  .signin input { flex: 1; }
</style>
</head>
<body>
<header hidden>
  <span class="org"></span>
  <button class="quiet back" hidden>← all agents</button>
  <span class="spacer"></span>
  <span class="who"></span>
  <form method="post" action="/logout"><button class="quiet">sign out</button></form>
</header>

<main>
  <section class="signin pad" hidden>
    <h1>kolo</h1>
    <p>Paste the token your org gave you. It is kept in a cookie this page cannot
       read, so you only do this once.</p>
    <form method="post" action="/login">
      <input name="token" type="password" placeholder="kolo_…" autofocus required>
      <button type="submit">sign in</button>
    </form>
    <p class="problem" hidden>That token is not one this hub knows.</p>
  </section>

  <section class="list pad" hidden>
    <table>
      <thead><tr><th>agent</th><th>status</th><th>where</th><th>asked for by</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="empty" hidden>No agents yet. Make one below.</p>

    <form class="create">
      <input name="name" placeholder="name" maxlength="32" required>
      <select name="host"></select>
      <select name="dir"></select>
      <select name="command"></select>
      <button type="submit">create</button>
    </form>
    <p class="note"></p>
  </section>

  <section class="watch" hidden>
    <div id="term"></div>
    <div class="ask" hidden></div>
    <p class="note"></p>
    <form class="compose" autocomplete="off">
      <input name="text" placeholder="send the agent a message" maxlength="2000" required>
      <button type="submit">send</button>
      <button type="button" class="dismiss" hidden>close this</button>
      <button type="button" class="interrupt" disabled>interrupt</button>
      <button type="button" class="restart">restart</button>
      <button type="button" class="fresh">start fresh</button>
    </form>
  </section>
</main>

<script src="/assets/xterm.js"></script>
<script src="/assets/addon-canvas.js"></script>
<script>
// One page, two views. Which is showing comes from the URL, so opening an agent
// and reloading lands back on that agent.
const el = (sel) => document.querySelector(sel);
const header = el('header');
const views = { signin: el('.signin'), list: el('.list'), watch: el('.watch') };

function show(name) {
  for (const [key, node] of Object.entries(views)) node.hidden = key !== name;
  header.hidden = name === 'signin';
  el('.back').hidden = name !== 'watch';
}

function agentInURL() {
  const m = location.hash.match(/^#\/agent\/([a-z0-9-]+)$/);
  return m && m[1];
}


let hosts = [];
let signedIn = false;

async function refresh() {
  const resp = await fetch('/v1/agents');
  signedIn = resp.status !== 401;
  if (!signedIn) {
    show('signin');
    el('.signin .problem').hidden = !location.search.includes('refused');
    return null;
  }
  const data = await resp.json();
  el('header .org').textContent = data.org;
  el('header .who').textContent = data.you.name;
  hosts = data.hosts;
  drawAgents(data.agents || []);
  drawChoices();
  return data;
}

function drawAgents(agents) {
  const body = el('.list tbody');
  body.replaceChildren();
  el('.list .empty').hidden = agents.length > 0;

  for (const a of agents) {
    const row = document.createElement('tr');
    row.className = 'agent';
    row.innerHTML = `
      <td class="name"><button></button></td>
      <td><span class="status"></span></td>
      <td class="dir"></td>
      <td></td>
      <td><button class="quiet stop">stop</button></td>`;
    // Text rather than interpolated: a directory is a path off somebody's disk
    // and goes on the page as-is.
    row.querySelector('.name button').textContent = a.name;
    const status = row.querySelector('.status');
    status.textContent = a.error ? `${a.status} — ${a.error}` : a.status;
    status.classList.add(a.status);
    row.querySelector('.dir').textContent = `${a.host}:${a.dir}`;
    row.children[3].textContent = a.created_by.name;

    row.querySelector('.name button').onclick = () => { location.hash = `#/agent/${a.name}`; };
    row.querySelector('.stop').onclick = () => stop(a.name);
    body.append(row);
  }
}

// The choices are the host's own terms, so nothing can be picked that will only
// be refused a moment later.
function drawChoices() {
  const hostSel = el('[name=host]'), dirSel = el('[name=dir]'), cmdSel = el('[name=command]');
  const chosen = hostSel.value;
  fill(hostSel, hosts.map((h) => h.id));
  if (chosen) hostSel.value = chosen;

  const host = hosts.find((h) => h.id === hostSel.value);
  fill(dirSel, host ? host.dirs : []);
  fill(cmdSel, host ? host.allow : []);
  el('.create button').disabled = hosts.length === 0;
  if (hosts.length === 0) say('.list', 'No machine is lending itself to this org right now.');
}

function fill(select, options) {
  const chosen = select.value;
  select.replaceChildren();
  for (const value of options) {
    const option = document.createElement('option');
    option.value = option.textContent = value;
    select.append(option);
  }
  if (options.includes(chosen)) select.value = chosen;
}

el('[name=host]').onchange = drawChoices;

el('.create').onsubmit = async (ev) => {
  ev.preventDefault();
  const form = new FormData(ev.target);
  const resp = await fetch('/v1/agents', {
    method: 'POST',
    body: JSON.stringify(Object.fromEntries(form)),
  });
  if (!resp.ok) {
    say('.list', (await resp.text()).trim(), true);
    return;
  }
  ev.target.querySelector('[name=name]').value = '';
  say('.list', '');
  refresh();
};

async function stop(name) {
  // Everyone has the same power over every agent, including this one, and
  // somebody may be in the middle of using it.
  if (!confirm(`Stop ${name}? Anyone watching loses it, including mid-task.`)) return;
  const resp = await fetch(`/v1/agents/${name}`, { method: 'DELETE' });
  if (!resp.ok) say('.list', (await resp.text()).trim(), true);
  refresh();
}

function say(view, message, problem) {
  const note = el(`${view} .note`);
  note.textContent = message;
  note.classList.toggle('problem', !!problem);
}


const term = new Terminal({
  // Nothing typed here reaches the agent, ever. What a member sends is a
  // message through a queue or a choice from the question on screen — never
  // keystrokes into somebody else's terminal.
  disableStdin: true,
  cursorBlink: false,
  fontFamily: 'ui-monospace, Menlo, Consolas, monospace',
  fontSize: 13,
  customGlyphs: true,
  theme: { background: '#0b0b0b' },
});
term.open(el('#term'));

// The DOM renderer sets block glyphs in whatever font the browser picks, which
// leaves seams between quadrants. The canvas renderer draws them itself, the way
// a real terminal does. An enhancement, not a requirement.
try {
  term.loadAddon(new CanvasAddon.CanvasAddon());
} catch (e) {
  console.warn('canvas renderer unavailable, falling back to the DOM', e);
}

let socket = null;
let watching = null;

function watch(name) {
  close();
  watching = name;
  connect(name);
}

function close() {
  watching = null;
  offer('unknown', []);
  if (socket) { const was = socket; socket = null; was.close(); }
}

function connect(name) {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}/v1/watch/${name}`);
  ws.binaryType = 'arraybuffer';
  socket = ws;

  // Every handler checks it is still the current socket: a superseded one still
  // reports its own close, which would land after the replacement opened.
  ws.onopen = () => { if (ws === socket) say('.watch', `watching ${name}`); };

  ws.onmessage = (ev) => {
    if (ws !== socket) return;
    if (typeof ev.data !== 'string') {
      term.write(new Uint8Array(ev.data));
      return;
    }
    const msg = JSON.parse(ev.data);
    switch (msg.type) {
      case 'size':
        term.resize(msg.cols, msg.rows);
        break;
      // Held is the normal case, not a failure: the agent may be working, or
      // asking a question that Enter would answer.
      case 'queued':
        say('.watch', `${msg.from}: ${waiting(msg.state, msg.pending)}`);
        break;
      // A command reached the agent with nobody's name on it — it had to, or
      // the agent's CLI would not have read it as one — so this line is the
      // only place it is attributed.
      case 'sent': {
        const what = msg.command ? `${msg.from} ran ${msg.text}` : `sent ${msg.from}'s message`;
        say('.watch', msg.pending > 0 ? `${what} · ${msg.pending} still waiting` : what);
        break;
      }
      case 'state':
        say('.watch', msg.pending > 0 ? waiting(msg.state, msg.pending) : describe(shown(msg)));
        break;
      case 'answered':
        say('.watch', `${msg.from} answered: ${msg.text}`);
        break;
      case 'interrupted':
        say('.watch', `${msg.from} stopped the agent`);
        break;
      case 'dismissed':
        say('.watch', `${msg.from} closed what the agent was showing`);
        break;
      // Both arrive just before the screen goes, so they are the last thing
      // anyone watching is told about the process they were watching.
      case 'restarted':
        say('.watch', `${msg.from} restarted the agent`);
        break;
      case 'fresh':
        say('.watch', `${msg.from} started the agent fresh — its conversation is gone`);
        break;
      case 'refused':
        say('.watch', msg.text, true);
        break;
    }
    // What can be done comes from the same events as what the agent is doing, so
    // the buttons never offer something the screen has left behind.
    if (msg.state) offer(msg.state, msg.options || []);
  };

  // Falling behind, an agent restarting, and one not started yet all end the
  // same way: reconnect, and the next repaint resyncs.
  ws.onclose = () => {
    if (ws !== socket) return;
    // Nothing may be offered about a screen this page is no longer being told
    // about: the agent may be answering, restarting, or gone.
    offer('unknown', []);
    say('.watch', `${name} is not showing a screen — waiting`);
    setTimeout(() => { if (watching === name) connect(name); }, 1000);
  };
  ws.onerror = () => ws.close();
}

// shown separates the two kinds of dialog the page has to talk about: one with
// choices to press, and one with nothing on it a member can answer.
function shown(msg) {
  if (msg.state === 'dialog' && !(msg.options || []).length) return 'panel';
  return msg.state;
}

// The states come from the agent's own screen, so this says what is true rather
// than what kolo intended.
function describe(state) {
  switch (state) {
    case 'idle': return 'ready';
    case 'busy': return 'working';
    case 'dialog': return 'asking the org a question — answer it below';
    // A dialog kolo could read no choices off: a panel a slash command opened,
    // or a question drawn in a way it does not understand. Either way there is
    // nothing to press but the Esc the agent's own footer offers.
    case 'panel': return 'showing something with nothing to answer — close it to get the agent back';
    default: return 'kolo does not recognise this screen, so nothing will be sent';
  }
}

function waiting(state, pending) {
  const ahead = pending > 1 ? `, ${pending} waiting` : '';
  if (state === 'idle') return `sending${ahead}`;
  return `waiting — the agent is ${describe(state)}${ahead}`;
}

// offer draws what a member may do to the agent as it stands. The buttons are
// rebuilt from the screen every time rather than left up and reasoned about,
// because the question they belong to can be answered by somebody else.
function offer(state, options) {
  const ask = el('.ask');
  ask.replaceChildren();
  ask.hidden = options.length === 0;
  for (const option of options) {
    const button = document.createElement('button');
    // Set as text: this is a line off the screen of somebody else's machine.
    button.textContent = `${option.number}. ${option.label}`;
    button.classList.toggle('selected', option.selected);
    button.onclick = () => tell({ type: 'answer', choice: option.number, label: option.label });
    ask.append(button);
  }
  el('.interrupt').disabled = state !== 'busy';
  // Only where there is nothing to answer. Where there are choices, Esc is not
  // "close this" but an answer nobody chose, and the buttons above are the way.
  el('.dismiss').hidden = !(state === 'dialog' && options.length === 0);
}

el('.dismiss').onclick = () => tell({ type: 'dismiss' });
el('.interrupt').onclick = () => tell({ type: 'interrupt' });

// Restart and start fresh are permitted on any screen — killing a process is
// safe whatever the agent is showing — so what stands between them and a
// misclick is the same thing that stands in front of a stop: being asked.
el('.restart').onclick = () => {
  if (!confirm(`Restart ${watching}? It comes back with its conversation, but whatever it is doing now is lost.`)) return;
  tell({ type: 'restart' });
};

el('.fresh').onclick = () => {
  if (!confirm(`Start ${watching} fresh? Everything the org has told it is forgotten.`)) return;
  tell({ type: 'fresh' });
};

// tell sends one thing to the agent. Who it is from is the hub's word, taken
// from the connection, so there is nothing to send about that.
function tell(what) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    say('.watch', 'not connected', true);
    return false;
  }
  socket.send(JSON.stringify(what));
  return true;
}

el('.compose').onsubmit = (ev) => {
  ev.preventDefault();
  const input = ev.target.querySelector('[name=text]');
  // Words only. A keystroke is never sent, whatever is on screen.
  if (tell({ type: 'message', text: input.value })) input.value = '';
};

// ---- routing -----------------------------------------------------------

el('.back').onclick = () => { location.hash = ''; };

async function route() {
  const data = await refresh();
  if (!data) return;

  const name = agentInURL();
  if (!name) {
    close();
    term.reset();
    show('list');
    return;
  }
  show('watch');
  if (watching !== name) watch(name);
}

addEventListener('hashchange', route);
route();
// The list is a live thing: agents appear when somebody else makes one, and
// change status on their own.
setInterval(() => { if (signedIn && !agentInURL()) refresh(); }, 3000);
</script>
</body>
</html>
