<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kolo</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/xterm.css">
<style>
  /* Every colour and face is the brand's, read from /assets/tokens.css — see
     docs/brand/kolo-brand.md. Nothing below invents one. */
  :root {
    --bg: var(--kolo-bg);
    --panel: var(--kolo-bg-raised);
    --raised: var(--kolo-bg-raised);
    --line: color-mix(in srgb, var(--kolo-slate) 30%, transparent);
    --text: var(--kolo-fg);
    --dim: var(--kolo-fg-muted);
    --faint: color-mix(in srgb, var(--kolo-fg-muted) 75%, transparent);
    --structure: var(--kolo-accent);
    --ui: var(--kolo-sans);
    --mono: var(--kolo-mono);
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--ui);
         -webkit-font-smoothing: antialiased; }
  /* Every display rule below would otherwise outrank the browser's own rule for
     the hidden attribute, which is how the views are switched. */
  [hidden] { display: none !important; }

  button, input, select {
    background: var(--raised); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: color-mix(in srgb, var(--kolo-chalk) 8%, var(--raised));
                                border-color: color-mix(in srgb, var(--kolo-slate) 55%, transparent); }
  button:disabled { opacity: .4; cursor: default; }
  button.quiet { background: none; border-color: transparent; color: var(--dim); }
  button.quiet:hover:not(:disabled) { background: var(--raised); color: var(--text); }
  button.go { background: var(--structure); border-color: var(--structure);
              color: var(--kolo-chalk); font-weight: 500; }
  button.go:hover:not(:disabled) { filter: brightness(1.15); }

  /* ---- the frame: agents down the side, one agent filling the rest -------- */

  .app { display: grid; grid-template-columns: 248px 1fr; height: 100%; }

  .side { display: flex; flex-direction: column; min-height: 0;
          background: var(--panel); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
  /* The mark is drawn at the size it is shown at: it is a screenful of
     characters, and a browser scaling it down turns them to mush. */
  .mark { width: 20px; height: 20px; border-radius: 5px; }
  .mark.big { width: 56px; height: 56px; border-radius: 13px; margin-bottom: 10px; }
  .brand b { font: 500 14px var(--mono); letter-spacing: var(--kolo-wordmark-tracking);
             text-transform: lowercase; }
  /* Without something between them the pair reads as "okolo". */
  .brand .rule { width: 1px; height: 15px; background: var(--kolo-slate); }
  .brand .org { color: var(--faint); font-size: 12px; }
  .side .heading { display: flex; align-items: center; padding: 6px 14px;
                   color: var(--faint); font-size: 11px; text-transform: uppercase;
                   letter-spacing: .8px; }
  .side .heading .spacer { flex: 1; }
  .agents { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 8px 8px; }
  .agents .empty { color: var(--faint); padding: 10px 6px; }

  /* One agent in the side. The whole row is the button: a list of things to open
     where only part of each row opens it is a list that feels broken. */
  .agent { position: relative; display: block; width: 100%; text-align: left;
           background: none; border: 1px solid transparent; border-radius: var(--r);
           padding: 8px 10px; margin-bottom: 2px; color: var(--text); }
  .agent:hover:not(:disabled) { background: var(--raised); border-color: transparent; }
  .agent.on { background: var(--raised); border-color: var(--line); }
  .agent .row { display: flex; align-items: center; gap: 7px; }
  .agent .name { font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .dir { display: block; color: var(--faint); font: 11px var(--mono); margin-top: 2px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A dot rather than a word: the status of eight agents should be readable
     without reading eight labels. */
  .dot { width: 7px; height: 7px; border-radius: 999px; flex: none;
         background: var(--kolo-state-idle); }
  /* Brass is not decoration: it means this agent is working right now, which
     the hub only says about the screen being watched. */
  .dot.busy { background: var(--kolo-state-running); }
  .dot.failed { background: var(--kolo-state-failed); }
  .agent .drop { position: absolute; right: 6px; top: 6px; padding: 2px 6px;
                 opacity: 0; color: var(--dim); }
  .agent:hover .drop { opacity: 1; }

  .side .me { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
              border-top: 1px solid var(--line); color: var(--dim); }
  .side .me .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .me form { margin: 0; }

  main { min-width: 0; display: flex; flex-direction: column; }

  /* ---- one agent ---------------------------------------------------------- */

  .watch { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .bar .title { display: flex; align-items: center; gap: 8px; flex: none;
                font: 500 14px var(--mono); }
  /* Buttons keep their words on one line; the directory is what gives way when
     the window is too narrow for all of it. */
  .bar button, .bar .typist { white-space: nowrap; }
  .bar .where { color: var(--faint); font: 11px var(--mono); min-width: 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .spacer { flex: 1; min-width: 0; }
  .bar .typist { color: var(--dim); }
  /* Holding the keyboard is a selection, not a state of the agent: structure
     rather than signal. */
  button.holding { border-color: var(--structure); color: var(--kolo-chalk);
                   background: color-mix(in srgb, var(--structure) 35%, transparent); }

  /* The agent's screen is drawn inside a frame of its own, so what the agent
     wrote and what this page says about it are never mistaken for each other.
     It fills everything the bar and the note leave. */
  .screen { flex: 1; min-height: 0; margin: 0 14px; padding: 6px;
            border: 1px solid var(--line); border-radius: 10px; background: var(--kolo-void);
            display: flex; overflow: hidden; }
  /* Whoever holds the keyboard holds this screen, so the frame says so — the
     same green as the button, where the eyes already are. */
  .screen.holding { border-color: var(--structure); }
  /* The terminal is sized to the grid the hub settled on, and centred in
     whatever the frame has left over. */
  #term { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

  /* One line, always: a note appearing and going must not resize the screen
     above it, which would cost every watcher a repaint at a new size. */
  .note { height: 30px; margin: 0; padding: 7px 15px; color: var(--dim);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note.problem { color: var(--kolo-state-failed); }

  /* ---- nothing open ------------------------------------------------------- */

  .home { flex: 1; min-height: 0; overflow-y: auto; display: flex;
          flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .home h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .home p { color: var(--dim); margin: 0 0 14px; }
  form.create { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                justify-content: center; background: var(--panel); padding: 14px;
                border: 1px solid var(--line); border-radius: 10px; }
  form.create input[name=name] { width: 16ch; }
  form.create select { max-width: 26ch; }

  /* ---- the door ----------------------------------------------------------- */

  .signin { max-width: 30em; margin: 16vh auto; padding: 0 20px; }
  .signin h1 { font-size: 20px; margin: 0 0 6px; }
  .signin p { color: var(--dim); line-height: 1.7; }
  .signin form { display: flex; gap: 8px; margin: 16px 0; }
  .signin input { flex: 1; font-family: var(--mono); }
  .signin .problem { color: var(--kolo-state-failed); }
</style>
</head>
<body>

<section class="signin" hidden>
  <img class="mark big" src="/assets/icon.png" alt="">
  <h1>kolo</h1>
  <p>Paste the token your org gave you. It is kept in a cookie this page cannot
     read, so you only do this once.</p>
  <form method="post" action="/login">
    <input name="token" type="password" placeholder="kolo_…" autofocus required>
    <button type="submit" class="go">sign in</button>
  </form>
  <p class="problem" hidden>That token is not one this hub knows.</p>
</section>

<div class="app" hidden>
  <aside class="side">
    <div class="brand"><img class="mark" src="/assets/icon.png" alt=""><b>kolo</b><span class="rule"></span><span class="org"></span></div>
    <div class="heading"><span>agents</span><span class="spacer"></span>
      <button class="quiet new" title="new agent">+</button>
    </div>
    <div class="agents">
      <p class="empty" hidden>No agents yet.</p>
    </div>
    <div class="me">
      <span class="who"></span>
      <form method="post" action="/logout"><button class="quiet">sign out</button></form>
    </div>
  </aside>

  <main>
    <section class="home" hidden>
      <h1>No agent open</h1>
      <p>Pick one from the side, or start another.</p>
      <form class="create">
        <input name="name" placeholder="name" maxlength="32" required>
        <select name="host"></select>
        <select name="dir"></select>
        <select name="command"></select>
        <button type="submit" class="go">create</button>
      </form>
      <p class="note"></p>
    </section>

    <section class="watch" hidden>
      <div class="bar">
        <div class="title"><span class="dot"></span><span class="agent-name"></span></div>
        <span class="where"></span>
        <span class="spacer"></span>
        <span class="typist"></span>
        <button type="button" class="keyboard">take the keyboard</button>
        <button type="button" class="interrupt" disabled>interrupt</button>
        <button type="button" class="quiet restart">restart</button>
        <button type="button" class="quiet fresh">start fresh</button>
      </div>
      <div class="screen"><div id="term"></div></div>
      <p class="note"></p>
    </section>
  </main>
</div>

<script src="/assets/xterm.js"></script>
<script src="/assets/addon-canvas.js"></script>
<script>
// One page, two views: the door, and the org's agents. Which agent is open comes
// from the URL, so opening one and reloading lands back on it.
const el = (sel) => document.querySelector(sel);
const views = { signin: el('.signin'), app: el('.app') };

function show(name) {
  for (const [key, node] of Object.entries(views)) node.hidden = key !== name;
}

function agentInURL() {
  const m = location.hash.match(/^#\/agent\/([a-z0-9-]+)$/);
  return m && m[1];
}

let hosts = [];
let signedIn = false;

async function refresh() {
  const resp = await fetch('/v1/agents');
  signedIn = resp.status !== 401;
  if (!signedIn) {
    show('signin');
    el('.signin .problem').hidden = !location.search.includes('refused');
    return null;
  }
  const data = await resp.json();
  show('app');
  el('.brand .org').textContent = data.org;
  el('.me .who').textContent = data.you.name;
  me = data.you;
  hosts = data.hosts;
  drawAgents(data.agents || []);
  drawChoices();
  return data;
}

// drawAgents redraws the side. Which one is open is read from the URL rather
// than remembered from the click that opened it, so a reload and somebody else's
// agent appearing land in the same place.
function drawAgents(agents) {
  const list = el('.agents');
  const open = agentInURL();
  for (const node of list.querySelectorAll('.agent')) node.remove();
  el('.agents .empty').hidden = agents.length > 0;

  for (const a of agents) {
    const row = document.createElement('button');
    row.className = 'agent' + (a.name === open ? ' on' : '');
    row.innerHTML = `
      <span class="row"><span class="dot"></span><span class="name"></span></span>
      <span class="dir"></span>
      <span class="quiet drop" title="stop">✕</span>`;
    // Text rather than interpolated: a name and a directory are somebody's, and
    // they go on the page as-is.
    row.querySelector('.name').textContent = a.name;
    row.querySelector('.dot').classList.toggle('failed', a.status === 'failed');
    if (a.name === open && doing === 'busy') row.querySelector('.dot').classList.add('busy');
    row.querySelector('.dir').textContent = `${a.host}:${a.dir}`;
    row.title = a.error ? `${a.status} — ${a.error}` : a.status;

    row.onclick = () => { location.hash = `#/agent/${a.name}`; };
    row.querySelector('.drop').onclick = (ev) => { ev.stopPropagation(); stop(a.name); };
    list.append(row);
    if (a.name === open) drawTitle(a);
  }
}

// drawTitle says which agent this screen belongs to, above the screen.
function drawTitle(a) {
  el('.bar .agent-name').textContent = a.name;
  el('.bar .where').textContent = `${a.host}:${a.dir}`;
  const dot = el('.bar .dot');
  dot.className = 'dot';
  dot.classList.toggle('failed', a.status === 'failed');
  dot.classList.toggle('busy', doing === 'busy');
  dot.title = a.error ? `${a.status} — ${a.error}` : a.status;
}

// drawChoices fills the create form with what the hosts are lending. The
// choices are the host's own terms, so nothing can be picked that will only be
// refused a moment later.
function drawChoices() {
  const hostSel = el('[name=host]'), dirSel = el('[name=dir]'), cmdSel = el('[name=command]');
  const chosen = hostSel.value;
  fill(hostSel, hosts.map((h) => h.id));
  if (chosen) hostSel.value = chosen;

  const host = hosts.find((h) => h.id === hostSel.value);
  fill(dirSel, host ? host.dirs : []);
  fill(cmdSel, host ? host.allow : []);
  el('form.create button').disabled = hosts.length === 0;
  if (hosts.length === 0) say('.home', 'No machine is lending itself to this org right now.');
}

// options may be absent rather than empty: a host that lends nothing sends null
// for it, and Go writes an empty slice as null besides. Reading it as [] keeps a
// missing list from throwing halfway through drawing the form, which is how the
// dir and command boxes came to be empty while the machine box was filled.
function fill(select, options) {
  const chosen = select.value;
  select.replaceChildren();
  for (const value of options || []) {
    const option = document.createElement('option');
    option.value = option.textContent = value;
    select.append(option);
  }
  if ((options || []).includes(chosen)) select.value = chosen;
}

el('select[name=host]').onchange = drawChoices;
el('.side .new').onclick = () => { location.hash = ''; el('input[name=name]').focus(); };

el('form.create').onsubmit = async (ev) => {
  ev.preventDefault();
  const form = new FormData(ev.target);
  const body = JSON.stringify({
    name: form.get('name'), host: form.get('host'),
    dir: form.get('dir'), command: form.get('command'),
  });
  const resp = await fetch('/v1/agents', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
  });
  if (!resp.ok) {
    say('.home', (await resp.text()).trim(), true);
    return;
  }
  ev.target.reset();
  say('.home', '');
  const made = await resp.json();
  await refresh();
  location.hash = `#/agent/${made.name}`;
};

async function stop(name) {
  if (!confirm(`Stop ${name}? Its conversation goes with it.`)) return;
  const resp = await fetch(`/v1/agents/${name}`, { method: 'DELETE' });
  if (!resp.ok) say('.home', (await resp.text()).trim(), true);
  if (agentInURL() === name) location.hash = '';
  refresh();
}

function say(view, message, problem) {
  const note = el(`${view} .note`);
  note.textContent = message;
  note.classList.toggle('problem', !!problem);
}


// The terminal is drawn at one size and never scaled to fill the window. The
// grid is the agent's, shared by everybody watching, and the hub already keeps
// it inside the smallest of their windows — so a window with room to spare shows
// the same screen with black around it rather than the same screen blown up.
const fontSize = 13;

const term = new Terminal({
  // Keystrokes reach the agent, but only from whoever has taken the keyboard —
  // see onData below. One typist at a time, because two people typing into one
  // terminal interleave inside a word.
  disableStdin: false,
  cursorBlink: true,
  // What the agent says is what the machine says, so it is said in the
  // brand's mono. The stack behind it is what draws until the file arrives.
  fontFamily: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
  fontSize: fontSize,
  customGlyphs: true,
  scrollback: 5000,
  theme: { background: '#101314', foreground: '#E7E9E4',
           cursor: '#2C6F62', selectionBackground: '#2C6F62' },
});
term.open(el('#term'));

// The DOM renderer sets block glyphs in whatever font the browser picks, which
// leaves seams between quadrants. The canvas renderer draws them itself, the way
// a real terminal does. An enhancement, not a requirement.
try {
  term.loadAddon(new CanvasAddon.CanvasAddon());
} catch (e) {
  console.warn('canvas renderer unavailable, falling back to the DOM', e);
}

// What the open agent's screen is doing, which is the only place brass is
// earned: the hub says this about the screen being watched and no other.
let doing = null;

// Who is typing at the agent being watched, and whether it is us.
let typist = null;
let mine = false;

// Keystrokes go up as they are pressed. Nothing is interpreted here: what the
// agent does with an Escape or an arrow is the agent's business, and the browser
// terminal has already encoded it the way a real one would.
term.onData((keys) => {
  if (!mine || !socket) return;
  tell({ type: 'keys', keys });
});

let socket = null;
let watching = null;
// Who the hub says we are. The page never decides this; it only compares.
let me = {};

// What the agent's terminal is, in cells. The hub decides it from every browser
// watching, so this follows rather than leads.
let grid = { cols: 120, rows: 40 };

// room is what the frame has left to draw a terminal in.
function room() {
  const box = el('#term').getBoundingClientRect();
  return { w: Math.floor(box.width), h: Math.floor(box.height) };
}

// cell is what one character measures, read back off the terminal rather than
// guessed at with a canvas: xterm decides its own line height and letter
// spacing, and a guess a pixel out puts a column over the edge.
//
// Measured once. It is the same for every character at a size that never
// changes, and measuring it again while a resize is still being drawn reads the
// old screen against the new grid — which is how a terminal ends up scaled to
// twice the window.
let measured = null;
function cell() {
  if (measured) return measured;
  const drawn = term.element && term.element.querySelector('.xterm-screen');
  if (!drawn || !drawn.offsetWidth || !term.cols || !term.rows) return null;
  measured = { w: drawn.offsetWidth / term.cols, h: drawn.offsetHeight / term.rows };
  return measured;
}

// propose tells the hub what this window can draw. Everyone watching sends this
// and the smallest wins, so nobody is shown a screen the agent has drawn wider
// than their window.
function propose() {
  const box = room(), c = cell();
  // A view that is not on screen measures zero, and the smallest proposal wins:
  // sizing the agent's terminal from a window nobody is looking at would shrink
  // it for everybody who is.
  if (!c || !box.w || !box.h) return;
  tell({
    type: 'size',
    cols: Math.max(20, Math.floor(box.w / c.w)),
    rows: Math.max(6, Math.floor(box.h / c.h)),
  });
}

addEventListener('resize', propose);

// A cell measured in the fallback face is the wrong width, and it is cached: the
// grid would be proposed from it for as long as the page is open. Measured again
// once the real face has arrived, and the hub told what changed.
if (document.fonts) {
  document.fonts.ready.then(() => { measured = null; propose(); });
}

function watch(name) {
  close();
  watching = name;
  connect(name);
}

function close() {
  watching = null;
  offer('unknown');
  // The keyboard is held by a connection, not by a member: leaving this agent
  // drops it even though the same person comes back. Forgetting it here is what
  // stops the returning page from offering to hand back a keyboard the hub has
  // already taken, and swallowing everything typed into it.
  typist = null; mine = false; keyboardChanged();
  if (socket) { const was = socket; socket = null; was.close(); }
}

function connect(name) {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}/v1/watch/${name}`);
  ws.binaryType = 'arraybuffer';
  socket = ws;

  // Every handler checks it is still the current socket: a superseded one still
  // reports its own close, which would land after the replacement opened.
  ws.onopen = () => {
    if (ws !== socket) return;
    say('.watch', `watching ${name}`);
    // Before anything else: the agent should be drawing a screen this window can
    // show, and it cannot know the size until somebody tells it.
    propose();
  };

  ws.onmessage = (ev) => {
    if (ws !== socket) return;
    if (typeof ev.data !== 'string') {
      term.write(new Uint8Array(ev.data));
      return;
    }
    const msg = JSON.parse(ev.data);
    switch (msg.type) {
      case 'size':
        grid = { cols: msg.cols, rows: msg.rows };
        term.resize(msg.cols, msg.rows);
        break;
      case 'state':
        say('.watch', describe(msg.state));
        break;
      case 'interrupted':
        say('.watch', `${msg.from} stopped the agent`);
        break;
      // Who has the keyboard, and who just lost it. Announced on the screen
      // everybody is watching, so it arrives in step with what the agent does.
      case 'keyboard':
        typist = msg.who || null;
        mine = !!msg.who && msg.id === me.id;
        keyboardChanged(msg.was);
        break;
      // Both arrive just before the screen goes, so they are the last thing
      // anyone watching is told about the process they were watching.
      case 'restarted':
        say('.watch', `${msg.from} restarted the agent`);
        break;
      case 'fresh':
        say('.watch', `${msg.from} started the agent fresh — its conversation is gone`);
        break;
      case 'refused':
        say('.watch', msg.text, true);
        break;
    }
    // What can be done comes from the same events as what the agent is doing, so
    // stop is never offered for a screen the agent has left behind.
    if (msg.state) offer(msg.state);
  };

  // Falling behind, an agent restarting, and one not started yet all end the
  // same way: reconnect, and the next repaint resyncs.
  ws.onclose = () => {
    if (ws !== socket) return;
    // Nothing may be offered about a screen this page is no longer being told
    // about: the agent may be restarting, or gone.
    offer('unknown');
    typist = null; mine = false; keyboardChanged();
    say('.watch', `${name} is not showing a screen — waiting`);
    setTimeout(() => { if (watching === name) connect(name); }, 1000);
  };
  ws.onerror = () => ws.close();
}

// The states come from the agent's own screen, so this says what is true rather
// than what kolo intended.
function describe(state) {
  switch (state) {
    case 'idle': return 'ready';
    case 'busy': return 'working';
    // Kolo says that a question is up, never what it is: reading the question is
    // what the screen in front of you is for, and answering it is what taking the
    // keyboard is for.
    case 'dialog': return 'waiting on a person — take the keyboard to answer it';
    default: return 'kolo does not recognise this screen, so nothing will be sent';
  }
}

// offer draws what a member may do to the agent as it stands. Stop is the only
// one of them that depends on the screen, and it is read from the same events as
// everything else so it is never offered for a screen the agent has left behind.
function offer(state) {
  doing = state;
  el('.interrupt').disabled = state !== 'busy';
  const dot = el('.bar .dot');
  if (dot) dot.classList.toggle('busy', state === 'busy');
}

// Taking it needs nobody's permission and cannot be refused: the agent belongs
// to the org, and taking the keyboard in front of everybody is the whole of the
// protocol. Handing it back is the same button, so there is one thing to press.
el('.keyboard').onclick = () => {
  tell({ type: mine ? 'release' : 'take' });
  if (!mine) term.focus();
};

// keyboardChanged redraws who is typing. Said out loud when it changes hands,
// because a member watching the screen move under them should know whose hands
// are on it.
function keyboardChanged(was) {
  const button = el('.keyboard');
  button.textContent = mine ? 'hand back the keyboard' : 'take the keyboard';
  button.classList.toggle('holding', mine);
  el('.screen').classList.toggle('holding', mine);
  el('.bar .typist').textContent = typist ? (mine ? 'you are typing' : `${typist} is typing`) : '';
  if (mine) {
    term.focus();
    say('.watch', was ? `you took the keyboard from ${was}` : 'you have the keyboard');
  } else if (typist) {
    say('.watch', `${typist} took the keyboard${was && was === me.name ? ' from you' : ''}`);
  }
}

el('.interrupt').onclick = () => tell({ type: 'interrupt' });

// Restart and start fresh are permitted on any screen — killing a process is
// safe whatever the agent is showing — so what stands between them and a
// misclick is the same thing that stands in front of a stop: being asked.
el('.restart').onclick = () => {
  if (!confirm(`Restart ${watching}? It comes back with its conversation, but whatever it is doing now is lost.`)) return;
  tell({ type: 'restart' });
};

el('.fresh').onclick = () => {
  if (!confirm(`Start ${watching} fresh? Everything the org has told it is forgotten.`)) return;
  tell({ type: 'fresh' });
};

// tell sends one thing to the agent. Who it is from is the hub's word, taken
// from the connection, so there is nothing to send about that.
function tell(what) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    say('.watch', 'not connected', true);
    return false;
  }
  socket.send(JSON.stringify(what));
  return true;
}


// ---- routing -----------------------------------------------------------

async function route() {
  const name = agentInURL();
  // The screen is put up before the list is fetched, so opening an agent does
  // not wait on a round trip that has nothing to do with it.
  el('.watch').hidden = !name;
  el('.home').hidden = !!name;
  if (name) {
    if (watching !== name) watch(name);
  } else {
    close();
    term.reset();
  }
  await refresh();
}

addEventListener('hashchange', route);
route();
// The list is a live thing: agents appear when somebody else makes one, and
// change status on their own.
setInterval(() => { if (signedIn) refresh(); }, 3000);
</script>
