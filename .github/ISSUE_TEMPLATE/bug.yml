name: Something went wrong
description: Kolo did something other than what it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. The two boxes below settle most
        reports on their own, so please fill them in even when the problem
        looks unrelated to either.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what kolo did, and what you expected instead.
      placeholder: |
        Ran kolo up in ~/work/api, opened the invite link on a second
        machine, started claude. The page went blank when the agent
        asked for permission to edit a file.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: kolo doctor
      description: >
        The whole output, please. It carries the version, the platform and
        what this machine can read off each agent, which is where a good
        share of these turn out to live.
      render: text
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Which agent, and which version of it
      description: >
        Kolo reads an agent's state off that agent's own screen, so a CLI
        that quietly changed its wording is a common cause. `claude
        --version`, `opencode --version`, whichever one it was.
      placeholder: claude 2.0.14

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Only if the trouble was on the page rather than in the terminal.
      placeholder: Safari 18.6 on an iPhone
